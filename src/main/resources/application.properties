# Base de datos PostgreSQL
# Equivale a ConnectionStrings:DefaultConnection en appsettings.json de .NET
spring.datasource.url=jdbc:postgresql://localhost:5432/creacionesnormita_dev
spring.datasource.username=postgres
spring.datasource.password=TuPasswordSegura
spring.datasource.driver-class-name=org.postgresql.Driver
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
imagenes.upload-dir=uploads
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1

# JPA / Hibernate (equivale a EF Core con UseNpgsql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto del servidor
server.port=8082

# JWT
# Equivale a JwtSettings en appsettings.json de .NET
# El secret DEBE tener al menos 32 caracteres (256 bits) para HMAC-SHA256
jwt.secret=SuperClaveSecretaDe32CaracteresMinimo!!
jwt.issuer=CreacionesNormitaAPI
jwt.audience=CreacionesNormitaClient
jwt.expiration-minutes=60